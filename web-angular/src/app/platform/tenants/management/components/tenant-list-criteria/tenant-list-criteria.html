<erp-option-select
  [label]="'general.sortBy' | uiText"
  [value]="reads.sortField()"
  [options]="sorts()"
  [controlHeight]="36"
  (valueChange)="choose($event)"
/>
<erp-sort-direction-button
  [compactOnSmallScreens]="true"
  [direction]="reads.sort()?.direction ?? null"
  (directionChange)="
    reads.changeSort($event ? { field: reads.sortField(), direction: $event } : null)
  "
/>
<erp-button
  [label]="'general.reset' | uiText"
  [compactOnSmallScreens]="true"
  variant="text"
  (activated)="reads.reset()"
>
  <erp-icon buttonIcon name="reset" />
</erp-button>
