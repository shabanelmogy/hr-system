<div class="create-workspace">
  <erp-page-header
    appearance="card"
    [title]="text(tenantId() === null ? 'addTenant' : 'editTenant')"
    [backLabel]="'actions.back' | uiText"
    [backDisabled]="editor.pending()"
    (backRequested)="back()"
  >
    <erp-popover-panel class="compact-summary" [label]="text('summaryTitle')">
      <erp-icon popoverTrigger name="company" />
      <erp-tenant-draft-summary />
    </erp-popover-panel>
  </erp-page-header>
  @switch (catalog.view().kind) {
    @case ('loading') {
      <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
    }
    @case ('error') {
      <erp-feedback-state
        kind="error"
        [title]="text('catalogLoadError')"
        [actionLabel]="'actions.retry' | uiText"
        (action)="catalog.refresh()"
      />
    }
    @case ('forbidden') {
      <erp-feedback-state kind="forbidden" [title]="'authorization.forbidden.title' | uiText" />
    }
    @case ('ready') {
      @if (editor.active() && editor.phase() === 'ready') {
        <div class="editor-layout">
          <erp-surface-card
            class="editor-card"
            [title]="text('formTitle')"
            [headerVisible]="false"
            icon="company"
            [fill]="true"
            [compact]="true"
          >
            <erp-tenant-form
              [tenantId]="tenantId()"
              [initialSection]="initialSection()"
              (cancelled)="back()"
            />
          </erp-surface-card>
          <aside [attr.aria-label]="text('summaryTitle')">
            <erp-tenant-draft-summary fill />
          </aside>
        </div>
      } @else {
        @switch (editor.phase()) {
          @case ('loading') {
            <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
          }
          @case ('error') {
            <erp-feedback-state
              kind="error"
              [title]="text('detailLoadError')"
              [message]="
                editor.feedback() ? locale.translate(editor.feedback(), 'platform-tenants') : ''
              "
              [actionLabel]="'actions.retry' | uiText"
              (action)="editor.retry()"
            />
          }
          @case ('catalog-error') {
            <erp-feedback-state
              kind="error"
              [title]="text('catalogCompatibility')"
              [actionLabel]="'actions.retry' | uiText"
              (action)="editor.retry()"
            />
          }
          @default {
            <erp-feedback-state
              kind="forbidden"
              [title]="'authorization.forbidden.title' | uiText"
            />
          }
        }
      }
    }
  }
</div>
