<erp-form
  [form]="editor.form"
  [title]="captions.text('title')"
  [submitLabel]="'actions.save' | uiText"
  [appearance]="appearance()"
  [fillContent]="appearance() === 'page'"
  [contentScroll]="false"
  [footerVisible]="selected() !== 'administrators'"
  [showSubmit]="selected() !== 'administrators'"
  [hideHeader]="true"
  [pending]="editor.pending()"
  [readOnly]="editor.uncertain() || editor.conflict()"
  [feedback]="
    editor.feedback() ? captions.locale.translate(editor.feedback(), 'platform-tenants') : ''
  "
  (sectionFocusRequested)="chooseSection($event)"
>
  @if (editor.conflict()) {
    <erp-button
      formTools
      [label]="captions.text('reloadCurrent')"
      variant="outlined"
      (activated)="editor.reload()"
      ><erp-icon buttonIcon name="refresh"
    /></erp-button>
  }
  <erp-content-tabs
    [tabs]="tabs()"
    [selected]="selected()"
    (selectedChange)="chooseSection($event)"
    [keepAlive]="true"
    fill
    [content]="sectionContent"
  />
  <ng-template #sectionContent let-section>
    @if (section === 'administrators') {
      @if (administratorsOpened()) {
        @if (tenantId(); as id) {
          <erp-tenant-admins-page [tenantId]="id" />
        } @else {
          <erp-feedback-state
            kind="empty"
            [title]="captions.text('saveBeforeAdministrators')"
            [message]="captions.text('saveBeforeAdministratorsDescription')"
            [actionLabel]="captions.text('tabs.identity')"
            (action)="chooseSection('identity')"
          />
        }
      }
    } @else {
      <erp-scroll-viewport [label]="captions.text('tabs.' + section)">
        <ng-container
          [ngTemplateOutlet]="fields"
          [ngTemplateOutletContext]="{ $implicit: section }"
        />
      </erp-scroll-viewport>
    }
  </ng-template>
  <ng-template #fields let-section>
    @switch (section) {
      @case ('identity') {
        <erp-tenant-identity-fields formSection="identity" />
      }
      @case ('subscription') {
        <erp-tenant-subscription-fields formSection="subscription" />
      }
      @case ('entitlements') {
        <erp-tenant-entitlement-field
          formSection="entitlements"
          [formField]="editor.form.entitlements"
          [modules]="editor.catalog.modules()"
          [label]="captions.label('entitlements')"
          [messages]="captions.messages()"
          [readOnly]="editor.locked()"
        />
      }
    }
  </ng-template>
  <erp-icon formSubmitIcon name="check" />
  <erp-button
    formActions
    [label]="'actions.cancel' | uiText"
    variant="outlined"
    [disabled]="editor.pending()"
    (activated)="cancelled.emit()"
  />
</erp-form>
