<main>
  <erp-page-header
    [exportSource]="exportSource()"
    variant="collection"
    [title]="captions.text('title')"
    [total]="null"
    [views]="views()"
    [filterVisible]="showFilters()"
    (filterToggle)="showFilters.set(!showFilters())"
    (refresh)="refresh()"
  />
  @if (reads.pending() && reads.source().kind === 'ready') {
    <erp-feedback-state kind="loading" layout="inline" [title]="captions.text('loading')" />
  }
  @if (options.view().kind === 'error') {
    <erp-feedback-state
      kind="error"
      layout="inline"
      [title]="captions.text('loadError')"
      [actionLabel]="captions.text('retry')"
      (action)="options.refresh()"
    />
  }
  @if (reads.invalid()) {
    <erp-feedback-state
      kind="error"
      layout="inline"
      [title]="captions.locale.translate('errorLogs.invalidRange', 'platform-advanced-tools')"
    />
  }
  @if (reads.pageError() && reads.source().kind === 'ready') {
    <erp-feedback-state
      kind="error"
      layout="inline"
      [title]="captions.text('loadError')"
      [actionLabel]="captions.text('retry')"
      (action)="reads.retry()"
    />
  }
  <div
    class="workspace"
    data-testid="system-audit"
    [attr.data-kind]="reads.source().kind"
    [attr.aria-busy]="reads.pending()"
  >
    <erp-audit-collection [filtersVisible]="showFilters()" />
  </div>
  <erp-audit-details />
</main>
