@if (auth.user(); as user) {
  <erp-page-header [title]="'general.home' | uiText" [subtitle]="'dashboard.welcome' | uiText" />
  <erp-surface-card [title]="'angularAuth.sessionReady' | uiText: 'platform-auth'">
    <p>{{ user.firstName }} {{ user.lastName }}</p>
    <p>{{ user.userName }}</p>
    <p>{{ user.tenantName }}</p>
    <p>{{ locale.language() === 'ar' ? user.companyNameAr : user.companyNameEn }}</p>
    @if (workspaceAllowed(auth.user())) {
      <erp-button [label]="'modules.title' | uiText" fullWidth (activated)="openApplications()" />
    }
    <erp-button
      [label]="'angularAuth.signOut' | uiText: 'platform-auth'"
      [busy]="auth.pending()"
      fullWidth
      (activated)="logout()"
    />
  </erp-surface-card>
}
