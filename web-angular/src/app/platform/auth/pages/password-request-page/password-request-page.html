<erp-auth-layout
  ><erp-form
    [form]="form"
    [title]="'auth.doYouForgetPassword' | uiText: 'platform-auth'"
    [submitLabel]="'auth.resetPassword' | uiText: 'platform-auth'"
    appearance="plain"
    [submitFullWidth]="true"
    [pending]="pending()"
    [feedbackKind]="feedback() === 'angularAuth.passwordRequestSent' ? 'success' : 'error'"
    [feedback]="feedback() ? (feedback() | uiText: 'platform-auth') : ''"
  >
    <erp-text-field
      [formField]="form.email"
      [label]="'auth.email' | uiText: 'platform-auth'"
      type="email"
      autocomplete="email"
      [messages]="messages()"
    />
  </erp-form>
  <p>
    <a routerLink="/login">{{ 'angularAuth.backToLogin' | uiText: 'platform-auth' }}</a>
  </p></erp-auth-layout
>
