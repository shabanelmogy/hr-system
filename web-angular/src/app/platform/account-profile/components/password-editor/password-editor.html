<erp-form
  [form]="state.passwordForm"
  [title]="text('password')"
  [submitLabel]="'actions.save' | uiText"
  appearance="page"
  [hideHeader]="true"
  [pending]="state.passwordForm().submitting()"
  [readOnly]="state.passwordLocked()"
  [showSubmit]="state.editingPassword()"
  [feedback]="state.passwordFeedback() ? (state.passwordFeedback() | uiText: 'platform-auth') : ''"
  [feedbackKind]="state.passwordFeedback() === 'accountProfile.passwordSaved' ? 'success' : 'error'"
>
  <div class="password-fields">
    <erp-text-field
      type="password"
      autocomplete="current-password"
      [formField]="state.passwordForm.currentPassword"
      [label]="text('currentPassword')"
      [messages]="messages()"
      [readOnly]="state.passwordLocked()"
    />
    <erp-text-field
      type="password"
      autocomplete="new-password"
      [formField]="state.passwordForm.newPassword"
      [label]="text('newPassword')"
      [help]="text('passwordPolicy')"
      [messages]="messages()"
      [readOnly]="state.passwordLocked()"
    />
  </div>
  @if (!state.editingPassword()) {
    <erp-button
      formTools
      [label]="text('changePassword')"
      variant="outlined"
      (activated)="state.editPassword()"
      [disabled]="state.pending()"
    />
  } @else {
    <erp-button
      formActions
      [label]="'actions.cancel' | uiText"
      variant="outlined"
      (activated)="state.cancelPassword()"
      [disabled]="state.passwordForm().submitting()"
    />
  }
  @if (state.passwordUncertain()) {
    <erp-button
      formTools
      [label]="'actions.reload' | uiText"
      variant="outlined"
      (activated)="state.recover()"
    />
  }
</erp-form>
