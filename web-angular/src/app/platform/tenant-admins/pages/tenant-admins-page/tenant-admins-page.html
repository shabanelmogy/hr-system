<main>
  <erp-page-header
    [exportSource]="exportSource()"
    variant="collection"
    actionsLayout="inline"
    [title]="text('title')"
    [subtitle]="text('subtitle')"
    [total]="tenantId() ? (tenantSource().result?.total ?? 0) : (reads.source().result?.total ?? 0)"
    [filterable]="false"
    [primaryAction]="editor.canWrite() ? { label: text('add'), icon: 'add' } : null"
    (primaryActivated)="create()"
    (refresh)="refresh()"
  />
  @if (choices.view().kind === 'error') {
    <erp-feedback-state
      kind="error"
      layout="inline"
      [title]="text('errors.lookup')"
      [actionLabel]="'actions.retry' | uiText"
      (action)="choices.refresh()"
    />
  }
  @if (choices.view().kind === 'forbidden') {
    <erp-feedback-state
      kind="forbidden"
      layout="inline"
      [title]="'authorization.forbidden.title' | uiText"
    />
  }
  <div class="workspace" data-testid="tenant-admins" [attr.data-kind]="reads.view().kind">
    <erp-selection-workspace
      [entries]="tenantId() ? [] : directory()"
      [label]="text('tenantDirectory')"
      [searchLabel]="text('searchTenants')"
      [selected]="selectedTenant()?.id ?? null"
      (selectionChange)="selectTenant($event)"
    >
      <erp-card-list
        compactLayout="single-column"
        frameAppearance="plain"
        [source]="tenantSource()"
        [label]="text('title')"
        [rowId]="id"
        [rowLabel]="label"
        [toolbarVisible]="false"
        [showFooter]="false"
        (retry)="reads.refresh()"
      >
        <ng-template [erpCollectionCardHeader]="tenantSource()" let-row
          ><erp-admin-card-header [admin]="row"
        /></ng-template>
        <ng-template [erpCollectionCard]="tenantSource()" let-row
          ><erp-admin-card-content [admin]="row"
        /></ng-template>
        <ng-template [erpCollectionCardFooter]="tenantSource()" let-row
          ><erp-row-actions
            [actions]="actions(row)"
            [rowKey]="row.id"
            (activated)="act(row, $event)"
        /></ng-template>
        <ng-template erpCollectionEmpty
          ><erp-feedback-state
            kind="empty"
            [title]="text(selectedTenant() ? 'emptyTenant' : 'empty')"
        /></ng-template>
      </erp-card-list>
    </erp-selection-workspace>
  </div>
  <erp-admin-editor />
  <erp-admin-delete-confirmation />
</main>
