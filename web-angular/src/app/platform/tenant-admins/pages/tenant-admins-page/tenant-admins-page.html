<main>
  <erp-page-header
    [exportSource]="exportSource()"
    variant="collection"
    [title]="text('title')"
    [subtitle]="text('subtitle')"
    [total]="reads.source().result?.total ?? 0"
    [filterable]="false"
    [primaryAction]="editor.canWrite() ? { label: text('add'), icon: 'add' } : null"
    (primaryActivated)="create()"
    (refresh)="refresh()"
  />
  @if (choices.view().kind === 'error') {
    <erp-feedback-state
      kind="error"
      layout="inline"
      [title]="text('errors.lookup')"
      [actionLabel]="'actions.retry' | uiText"
      (action)="choices.refresh()"
    />
  }
  @if (choices.view().kind === 'forbidden') {
    <erp-feedback-state
      kind="forbidden"
      layout="inline"
      [title]="'authorization.forbidden.title' | uiText"
    />
  }
  <div class="workspace" data-testid="tenant-admins" [attr.data-kind]="reads.view().kind">
    <erp-card-list
      appearance="entity"
      layout="fit"
      [minCardWidth]="320"
      [source]="reads.source()"
      [label]="text('title')"
      [rowId]="id"
      [rowLabel]="label"
      [toolbarVisible]="false"
      [showFooter]="false"
      (retry)="reads.refresh()"
    >
      <ng-template [erpCollectionCardHeader]="reads.source()" let-row
        ><erp-admin-card-header [admin]="row"
      /></ng-template>
      <ng-template [erpCollectionCard]="reads.source()" let-row
        ><erp-admin-card-content [admin]="row"
      /></ng-template>
      <ng-template [erpCollectionCardFooter]="reads.source()" let-row
        ><erp-row-actions [actions]="actions(row)" [rowKey]="row.id" (activated)="act(row, $event)"
      /></ng-template>
      <ng-template erpCollectionEmpty
        ><erp-feedback-state kind="empty" [title]="text('empty')"
      /></ng-template>
    </erp-card-list>
  </div>
  <erp-admin-editor />
  <erp-admin-delete-confirmation />
</main>
