@if (current(); as resource) {
  <section [attr.aria-label]="title()" [class.fill]="fill()">
    @if (showActions()) {
      <ng-container [ngTemplateOutlet]="actions" />
    }
    @if (inlineSupported) {
      <iframe [src]="resource.safe" [title]="title()" referrerpolicy="no-referrer"></iframe>
    } @else {
      <p role="status">{{ 'reports.previewUnavailable' | uiText }}</p>
    }
  </section>
}
<ng-template #actions>
  @if (current(); as resource) {
    <nav
      [attr.aria-label]="title()"
      [class.stacked]="actionsLayout() === 'stacked'"
      [class.toolbar]="actionsLayout() === 'toolbar'"
    >
      <a
        pButton
        [href]="resource.url"
        target="_blank"
        rel="noopener noreferrer"
        referrerpolicy="no-referrer"
        [attr.aria-label]="'reports.openPdf' | uiText"
        [title]="'reports.openPdf' | uiText"
        ><erp-icon name="openInNew" /><span>{{ 'reports.openPdf' | uiText }}</span></a
      >
      <a
        pButton
        variant="outlined"
        [href]="resource.url"
        [download]="downloadName()"
        [attr.aria-label]="'common.downloadFile' | uiText"
        [title]="'common.downloadFile' | uiText"
        ><erp-icon name="download" /><span>{{ 'common.downloadFile' | uiText }}</span></a
      >
    </nav>
  }
</ng-template>
