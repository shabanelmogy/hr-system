<erp-button
  [label]="label()"
  [disabled]="disabled() || !model().length"
  [expanded]="opened()"
  [controls]="menuId"
  hasPopup="menu"
  (activated)="toggle($event)"
>
  <span buttonEndIcon class="action-menu-indicator" [class.expanded]="opened()" aria-hidden="true">
    <erp-icon name="chevronDown" />
  </span>
</erp-button>
<p-menu
  [id]="menuId"
  [model]="model()"
  [popup]="true"
  [ariaLabel]="label()"
  appendTo="body"
  [dt]="tokens"
  [style]="{ maxWidth: 'calc(100vw - 24px)' }"
  (onShow)="opened.set(true)"
  (onHide)="opened.set(false)"
>
  <ng-template #item let-item>
    <a class="p-menu-item-link action-menu-item">
      @if (item.icon) {
        <erp-icon [name]="item.icon" />
      }
      <span class="p-menu-item-label">{{ item.label }}</span>
    </a>
  </ng-template>
</p-menu>
