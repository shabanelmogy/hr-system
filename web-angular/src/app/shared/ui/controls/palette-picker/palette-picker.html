<fieldset>
  <legend>{{ label() }}</legend>
  <div class="palette-options" role="radiogroup" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
      <label
        class="palette-option"
        [for]="groupName + '-' + option.value"
        [class.selected]="value() === option.value"
      >
        <p-radiobutton
          [name]="groupName"
          [inputId]="groupName + '-' + option.value"
          [value]="option.value"
          [formControl]="control"
          [ariaLabel]="labels()[option.value]"
        />
        <span
          class="palette-preview"
          [style.background]="option.colors.background"
          [style.border-color]="option.colors.border"
        >
          <span class="primary-dot" [style.background]="option.colors.primary"></span
          ><span class="secondary-dot" [style.background]="option.colors.brand2"></span> </span
        ><span class="palette-name">{{ labels()[option.value] }}</span>
      </label>
    }
  </div>
</fieldset>
