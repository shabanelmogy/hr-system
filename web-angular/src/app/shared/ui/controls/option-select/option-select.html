<div class="preference-select">
  <p-select
    [inputId]="id"
    [options]="selectableOptions()"
    optionLabel="label"
    optionValue="value"
    [ariaLabel]="appearance() === 'context' ? label() + ': ' + selectedLabel() : label()"
    [formControl]="control"
    [appendTo]="overlayTarget()"
    [fluid]="appearance() !== 'context'"
    [loading]="busy()"
    [placeholder]="emptyLabel()"
    [invalid]="invalid()"
    [checkmark]="true"
    [size]="height() <= 32 ? 'small' : undefined"
    panelStyleClass="erp-select-overlay"
    scrollHeight="min(20rem, 60dvh)"
    [dt]="tokens()"
    [pt]="valueAttributes()"
    [style]="{
      height: appearance() === 'context' ? '36px' : height() + 'px',
      color: 'inherit',
      maxWidth: '100%',
    }"
  >
    <ng-template #selectedItem let-option>
      @if (appearance() === 'context') {
        <erp-context-badge [label]="label()" [value]="selectedLabel()" [icon]="icon()" />
      } @else {
        {{ option?.label }}
      }
    </ng-template>
    @if (menuLabel()) {
      <ng-template #header
        ><div class="select-menu-heading">{{ menuLabel() }}</div></ng-template
      >
    }
    <ng-template #item let-option
      ><span class="option-item">
        @if (option.icon) {
          <span class="option-icon"><erp-icon [name]="option.icon" /></span>
        }
        <span class="option-copy"
          ><span>{{ option.label }}</span>
          @if (option.description) {
            <small>{{ option.description }}</small>
          }
        </span></span
      ></ng-template
    >
  </p-select>
  @if (appearance() !== 'context' && labelVisibility() === 'visible') {
    <label [for]="id">{{ label() }}</label>
  }
</div>
