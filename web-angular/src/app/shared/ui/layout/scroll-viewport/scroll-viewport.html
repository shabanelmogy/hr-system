<p-scrollarea variant="auto" [dt]="tokens" [style]="{ width: '100%', height: '100%', border: '0' }">
  <p-scrollarea-viewport
    class="scroll-viewport"
    role="region"
    [attr.aria-label]="label()"
    [style.overflow-x]="'hidden'"
  >
    <p-scrollarea-content class="scroll-content" [class.fill]="fillContent()"
      ><ng-content
    /></p-scrollarea-content>
  </p-scrollarea-viewport>
  <p-scrollarea-scrollbar orientation="vertical" class="scroll-track"
    ><p-scrollarea-handle class="scroll-handle"
  /></p-scrollarea-scrollbar>
</p-scrollarea>
