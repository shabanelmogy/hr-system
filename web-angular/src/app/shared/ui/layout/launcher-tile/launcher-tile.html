<a
  class="launcher-tile"
  [routerLink]="item().href"
  [attr.aria-label]="item().label"
  [style.--accent]="item().accent"
  [style.--accent-contrast]="item().contrast"
>
  <span class="launcher-arrow"><erp-icon name="forward" /></span
  ><span class="launcher-icon"><erp-icon [name]="item().icon" /></span>
  @if (item().eyebrow) {
    <span class="eyebrow">{{ item().eyebrow }}</span>
  }
  <strong>{{ item().label }}</strong>
</a>
