<form
  novalidate
  [class.plain]="appearance() !== 'card'"
  [class.dialog-form]="appearance() === 'dialog'"
  [class.page-form]="appearance() === 'page'"
  [class.filled-form]="fillContent()"
  [class.sidebar-form]="appearance() === 'sidebar'"
  [attr.aria-label]="title()"
  [attr.aria-busy]="pending() || checking() ? 'true' : null"
  (submit)="submit($event)"
>
  @if (!hideHeader()) {
    <header>
      <h2>{{ title() }}</h2>
      <ng-content select="[formHeader]" />
    </header>
  }
  @if (fillContent()) {
    <erp-scroll-viewport class="form-scroll" [label]="title()">
      <ng-container [ngTemplateOutlet]="formBody" />
    </erp-scroll-viewport>
  } @else {
    <ng-container [ngTemplateOutlet]="formBody" />
  }
  <footer>
    <div class="form-tools"><ng-content select="[formTools]" /></div>
    <ng-container [ngTemplateOutlet]="appearance() === 'sidebar' ? submitAction : null" />
    <ng-content select="[formActions]" />
    <ng-container [ngTemplateOutlet]="appearance() !== 'sidebar' ? submitAction : null" />
  </footer>
  <ng-content select="[afterSubmit]" />
</form>
<ng-template #formBody>
  @if (validationIssues().length) {
    <erp-validation-summary [issues]="validationIssues()" (issueSelected)="focusError($event)" />
  }
  @if (feedback()) {
    <p
      [attr.role]="feedbackKind() === 'error' ? 'alert' : 'status'"
      class="form-feedback"
      [class.success]="feedbackKind() === 'success'"
    >
      {{ feedback() }}
    </p>
  }
  <section class="form-content"><ng-content /></section>
</ng-template>
<ng-template #submitAction>
  @if (showSubmit()) {
    <erp-button
      [label]="submitLabel()"
      type="submit"
      [fullWidth]="submitFullWidth()"
      [disabled]="readOnly()"
      [busy]="pending() || checking()"
      ><ng-content select="[formSubmitIcon]" ngProjectAs="[buttonIcon]"
    /></erp-button>
  }
</ng-template>
