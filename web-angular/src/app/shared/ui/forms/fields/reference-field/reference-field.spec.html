<erp-form [form]="form" title="Field fixture" submitLabel="Save fixture">
  <erp-text-field [formControl]="form.controls.name" label="Name fixture" [messages]="messages" />
  <erp-reference-field
    [formControl]="form.controls.reference"
    label="Reference fixture"
    [source]="source()"
    [selection]="selection()"
    [readOnly]="readonly()"
    [messages]="messages"
  />
</erp-form>
