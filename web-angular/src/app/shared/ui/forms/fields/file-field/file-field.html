<div #field [attr.aria-labelledby]="id + '-label'" [attr.aria-describedby]="describedBy()">
  <span [id]="id + '-label'" class="field-label">{{ label() }}</span>
  <p-fileupload
    [mode]="dropzone() ? 'advanced' : 'basic'"
    [customUpload]="true"
    [auto]="false"
    [multiple]="false"
    [showUploadButton]="false"
    [showCancelButton]="false"
    [accept]="acceptTypes()"
    [chooseLabel]="chooseLabel()"
    [disabled]="isDisabled() || isReadOnly()"
    (onSelect)="select($event)"
  >
    <ng-template #content>
      @if (dropLabel()) {
        <p>{{ dropLabel() }}</p>
      }
    </ng-template>
  </p-fileupload>
  @if (value(); as file) {
    <p>{{ file.name }} · {{ file.size }}</p>
    <erp-button
      [label]="clearLabel()"
      variant="text"
      [disabled]="isDisabled() || isReadOnly()"
      (activated)="clear()"
    />
  }
  @if (help()) {
    <small [id]="id + '-help'">{{ help() }}</small>
  }
  @if (error(); as message) {
    <small [id]="id + '-error'" class="error" role="alert">{{ message }}</small>
  }
</div>
