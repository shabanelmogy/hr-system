<erp-dialog-panel
  [open]="open()"
  [title]="title()"
  [description]="description()"
  [closeLabel]="cancelLabel()"
  [pending]="pending()"
  [manualInitialFocus]="true"
  (closeRequested)="cancel()"
  (shown)="focusSafeAction()"
>
  <ng-content />
  <erp-button
    #safeAction
    dialogActions
    [label]="cancelLabel()"
    variant="text"
    [disabled]="pending()"
    (activated)="cancel()"
  />
  <erp-button
    dialogActions
    [label]="confirmLabel()"
    [severity]="severity()"
    [busy]="pending()"
    (activated)="confirm()"
  />
</erp-dialog-panel>
