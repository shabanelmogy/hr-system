<erp-dialog-panel
  [open]="!!notices.error()"
  [title]="locale.translate(notices.error()?.titleKey ?? 'errorDialog.title')"
  [closeLabel]="'actions.close' | uiText"
  [manualInitialFocus]="true"
  icon="close"
  tone="danger"
  (shown)="focusClose()"
  (closeRequested)="notices.dismissError()"
>
  @if (notices.error(); as error) {
    <p class="error-message" role="alert">
      {{ locale.translate(error.key, error.namespace, error.params) }}
    </p>
  }
  <erp-button
    #dismissAction
    dialogActions
    [label]="'actions.close' | uiText"
    (activated)="notices.dismissError()"
  />
</erp-dialog-panel>
