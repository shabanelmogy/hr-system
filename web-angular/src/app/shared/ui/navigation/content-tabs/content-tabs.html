<p-tabs [value]="active()" [dt]="tokens" (valueChange)="select($event)">
  <p-tablist>
    @for (tab of tabs(); track tab.id) {
      <p-tab [value]="tab.id">{{ tab.label }}</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    @for (tab of tabs(); track tab.id) {
      <p-tabpanel [value]="tab.id">
        @if (keepAlive() || active() === tab.id) {
          <ng-container
            [ngTemplateOutlet]="content()"
            [ngTemplateOutletContext]="{ $implicit: tab.id }"
          />
        }
      </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
