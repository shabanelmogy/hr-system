<erp-data-table
  #grid
  label="Fixture"
  [source]="source()"
  [columns]="columns"
  [rowId]="id"
  [headerGroups]="groups"
  [advancedFilters]="true"
  (sortChange)="sorted($event)"
>
  @if (showCustomHeader()) {
    <ng-template [erpCollectionColumnHeader]="columns | collectionColumn: headerKey()" let-column
      ><span data-testid="custom-header">{{ column.header }} custom</span></ng-template
    >
  }
  <ng-template
    [erpCollectionColumnFooter]="columns | collectionColumn: 'amount'"
    let-page
    let-total="total"
    let-currentQuery="query"
    ><output data-testid="custom-footer"
      >{{ sum(page) }} / {{ total }} / {{ currentQuery.scopeKey }}</output
    ></ng-template
  >
</erp-data-table>
