@if (kind() === 'ready' && emptyTemplate(); as template) {
  <ng-container *ngTemplateOutlet="template" />
} @else {
  <erp-feedback-state
    [kind]="feedbackKind()"
    [title]="
      (kind() === 'loading'
        ? 'common.loading'
        : kind() === 'ready'
          ? 'pagination.noData'
          : kind() === 'forbidden'
            ? 'authorization.forbidden.title'
            : 'common.error'
      ) | uiText
    "
    [actionLabel]="kind() === 'error' ? ('actions.retry' | uiText) : ''"
    (action)="retry.emit()"
  />
}
