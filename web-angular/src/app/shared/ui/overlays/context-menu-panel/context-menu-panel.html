<p-contextmenu
  #menu
  [model]="model()"
  [ariaLabel]="label()"
  appendTo="body"
  [style]="{ maxWidth: 'calc(100vw - 24px)' }"
  [dt]="tokens"
  (onHide)="closed()"
>
  <ng-template #item let-item
    ><a class="p-contextmenu-item-link">
      @if (item.icon) {
        <erp-icon [name]="item.icon" />
      }
      <span class="p-contextmenu-item-label">{{ item.label }}</span></a
    ></ng-template
  >
</p-contextmenu>
