<erp-button
  #trigger
  [label]="label()"
  [appearance]="triggerAppearance()"
  variant="text"
  [expanded]="opened()"
  hasPopup="dialog"
  [disabled]="disabled()"
  (activated)="toggle($event)"
  ><ng-content select="[popoverTrigger]" ngProjectAs="[buttonIcon]"
/></erp-button>
<p-popover
  #panel
  appendTo="body"
  [ariaLabel]="label()"
  [style]="{ width: '340px', maxWidth: 'calc(100vw - 24px)' }"
  (onShow)="opened.set(true)"
  (onHide)="hidden()"
  ><ng-content
/></p-popover>
