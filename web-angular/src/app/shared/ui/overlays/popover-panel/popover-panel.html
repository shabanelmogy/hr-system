<erp-button
  #trigger
  [label]="triggerText() ?? label()"
  [accessibleLabel]="label()"
  [appearance]="triggerAppearance()"
  variant="text"
  [expanded]="opened()"
  hasPopup="dialog"
  [disabled]="disabled()"
  (activated)="toggle($event)"
  ><ng-content select="[popoverTrigger]" ngProjectAs="[buttonIcon]"
/></erp-button>
<p-popover
  #panel
  appendTo="body"
  [ariaLabel]="label()"
  [style]="{ width: '340px', maxWidth: 'calc(100vw - 24px)' }"
  (onShow)="opened.set(true)"
  (onHide)="hidden()"
  ><div class="popover-content"><ng-content /></div
></p-popover>
