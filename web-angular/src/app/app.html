@if (!preview.standalone) {
  <router-outlet />
}
@defer (when preview.active() !== null) {
  <erp-responsive-preview-host />
}
@defer (when drafts.prompt()) {
  <erp-unsaved-confirmation-host />
}
@defer (when notifications.toasts().length) {
  <erp-notification-toast />
}
@defer (when notifications.error()) {
  <erp-error-modal-host />
}
