<main>
  <erp-page-header
    [exportSource]="exportSource()"
    variant="collection"
    [actionsLayout]="view() === 'import' ? 'stacked' : 'adaptive'"
    [title]="'districts.viewTitle' | uiText: 'reference-districts'"
    [views]="views()"
    [view]="view()"
    [total]="view() === 'report' || view() === 'import' ? null : state.total()"
    [totalLabel]="'pagination.items' | uiText"
    [filterable]="view() !== 'import' && view() !== 'chart'"
    [filterVisible]="filtersVisible()"
    (viewChange)="chooseView($event)"
    (refresh)="refreshCurrent()"
    (filterToggle)="toggleFilters()"
    [primaryAction]="
      view() !== 'import' && editor.canCreate()
        ? { label: districtText('districts.add'), icon: 'add' }
        : null
    "
    (primaryActivated)="editor.create()"
  >
    <ng-container [ngTemplateOutlet]="reportHeaderActions()" />
    <ng-container [ngTemplateOutlet]="importHeaderActions()" />
  </erp-page-header>
  <div class="workspace" data-testid="districts" [attr.data-kind]="state.source().kind">
    @if (view() === 'grid' || view() === 'cards') {
      <erp-district-collection-view
        [kind]="view() === 'cards' ? 'cards' : 'grid'"
        [searchVisible]="searchVisible()"
      />
    } @else if (view() === 'chart') {
      @defer (on immediate) {
        <erp-collection-chart-view
          [source]="state.source()"
          [rowId]="id"
          [label]="'districts.charts.title' | uiText: 'reference-districts'"
          [metrics]="analytics().metrics"
          [plots]="analytics().plots"
          (retry)="state.refresh()"
        >
          <ng-template erpCollectionEmpty
            ><erp-feedback-state
              kind="empty"
              [title]="'districts.charts.noData' | uiText: 'reference-districts'"
          /></ng-template>
        </erp-collection-chart-view>
      } @placeholder {
        <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
      }
    } @else if (view() === 'import') {
      @defer (on immediate) {
        <erp-district-import-view
          #districtImport
          [externalActions]="true"
          (review)="chooseView('grid'); state.refresh()"
        />
      } @placeholder {
        <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
      }
    } @else if (view() === 'report' && canReport()) {
      @defer (on immediate) {
        <erp-global-report-view
          [externalActions]="true"
          #districtReport
          entity="districts"
          [embedded]="true"
          [showFilterBar]="reportFiltersVisible()"
          [catalogErrorMessage]="districtText('districts.reportCatalogError')"
          [unavailableMessage]="districtText('districts.reportUnavailable')"
        />
      } @placeholder {
        <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
      }
    }
  </div>
  <erp-district-detail-dialog /><erp-district-editor
    (saved)="saved($event)"
  /><erp-district-lifecycle-confirmation />
</main>
