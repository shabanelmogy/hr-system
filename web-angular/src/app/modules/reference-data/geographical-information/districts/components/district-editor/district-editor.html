<erp-dialog-panel
  [open]="state.active()"
  [title]="
    (state.mode() === 'create' ? 'districts.add' : 'districts.edit') | uiText: 'reference-districts'
  "
  [description]="
    (state.mode() === 'create' ? 'districts.addSubtitle' : 'districts.editSubtitle')
      | uiText: 'reference-districts'
  "
  [closeLabel]="'actions.close' | uiText"
  [icon]="state.mode() === 'create' ? 'add' : 'edit'"
  [pending]="state.pending()"
  [showFooter]="false"
  (closeRequested)="closeGuard().requestClose()"
>
  @if (state.active()) {
    @switch (state.phase()) {
      @case ('loading') {
        <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
      }
      @case ('error') {
        <erp-feedback-state
          kind="error"
          [title]="'districts.detailLoadError' | uiText: 'reference-districts'"
          [actionLabel]="'actions.retry' | uiText"
          (action)="state.retry()"
        />
      }
      @case ('forbidden') {
        <erp-feedback-state kind="forbidden" [title]="'authorization.forbidden.title' | uiText" />
      }
      @case ('ready') {
        <erp-form
          #entryForm
          [form]="state.form"
          appearance="dialog"
          [hideHeader]="true"
          [title]="'districts.title' | uiText: 'reference-districts'"
          [submitLabel]="
            (state.mode() === 'create' ? 'districts.add' : 'actions.save')
              | uiText: (state.mode() === 'create' ? 'reference-districts' : 'core')
          "
          [pending]="state.pending()"
          [readOnly]="state.uncertain()"
          [feedback]="
            state.feedback() ? locale.translate(state.feedback(), 'reference-districts') : ''
          "
          [feedbackKind]="state.feedbackKind()"
        >
          <erp-text-field
            [formField]="state.form.nameAr"
            [label]="label('nameAr')"
            [messages]="messages().nameAr"
            [readOnly]="state.locked()"
            [showCounter]="true"
            counterAppearance="badge"
          />
          <erp-text-field
            [formField]="state.form.nameEn"
            [label]="label('nameEn')"
            [messages]="messages().nameEn"
            [readOnly]="state.locked()"
            [showCounter]="true"
            counterAppearance="badge"
          />
          <erp-text-field
            [formField]="state.form.code"
            [label]="label('code')"
            [messages]="messages().code"
            [readOnly]="state.locked()"
            textDirection="ltr"
            [showCounter]="true"
            counterAppearance="badge"
          />
          <erp-reference-field
            [formField]="state.form.stateId"
            [label]="label('stateId')"
            [source]="state.parents.source()"
            [searchText]="state.parents.searchText()"
            [selection]="
              state.parents.selection(state.form.stateId().value(), state.retainedState())
            "
            [messages]="messages().stateId"
            [readOnly]="state.locked()"
            (searchChange)="state.parents.changeSearch($event)"
            (retry)="state.parents.refresh()"
          />
          @if (state.development) {
            <erp-button
              formTools
              [label]="'districts.generateMockData' | uiText: 'reference-districts'"
              variant="text"
              [disabled]="state.locked()"
              (activated)="state.generate()"
              ><erp-icon buttonIcon name="refresh"
            /></erp-button>
          }
          <erp-icon
            formSubmitIcon
            [name]="state.mode() === 'create' ? 'add' : 'check'"
          /><erp-button
            formActions
            [label]="'actions.cancel' | uiText"
            variant="outlined"
            [disabled]="state.pending()"
            (activated)="closeGuard().requestClose()"
          />
        </erp-form>
      }
    }
  }
</erp-dialog-panel>
<erp-form-close-guard
  [identity]="state.identity()"
  [revision]="state.revision()"
  [active]="state.active()"
  [unsaved]="state.unsaved()"
  [pending]="state.pending()"
  (closed)="state.close($event)"
/>
