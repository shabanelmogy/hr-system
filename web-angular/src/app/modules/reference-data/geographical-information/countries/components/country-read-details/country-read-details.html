<erp-form
  [form]="form"
  [title]="'countries.view' | uiText: 'reference-countries'"
  [submitLabel]="'actions.view' | uiText"
  appearance="dialog"
  [hideHeader]="true"
  [readOnly]="true"
  [showSubmit]="false"
>
  <div class="metadata">
    <erp-status-badge
      appearance="outline"
      [label]="('general.id' | uiText) + ': ' + country().id"
    /><erp-status-badge
      [label]="
        (country().isDeleted ? 'countries.status.archived' : 'countries.status.active')
          | uiText: 'reference-countries'
      "
      [accent]="country().isDeleted ? 'var(--destructive)' : 'var(--success)'"
    />
  </div>
  <div class="names">
    <erp-text-field
      [formControl]="form.controls.nameAr"
      [label]="'general.nameAr' | uiText"
      [readOnly]="true"
    />
    <erp-text-field
      [formControl]="form.controls.nameEn"
      [label]="'general.nameEn' | uiText"
      [readOnly]="true"
    />
  </div>
  <div class="codes">
    <erp-text-field
      [formControl]="form.controls.alpha2Code"
      [label]="'countries.alpha2Code' | uiText: 'reference-countries'"
      [readOnly]="true"
      textDirection="ltr"
    />
    <erp-text-field
      [formControl]="form.controls.alpha3Code"
      [label]="'countries.alpha3Code' | uiText: 'reference-countries'"
      [readOnly]="true"
      textDirection="ltr"
    />
    <erp-text-field
      [formControl]="form.controls.phoneCode"
      [label]="'countries.phoneCode' | uiText: 'reference-countries'"
      [readOnly]="true"
      textDirection="ltr"
    />
    <erp-text-field
      [formControl]="form.controls.currencyCode"
      [label]="'countries.currencyCode' | uiText: 'reference-countries'"
      [readOnly]="true"
      textDirection="ltr"
    />
  </div>
  <erp-button
    formActions
    [label]="'actions.close' | uiText"
    variant="outlined"
    (activated)="closed.emit()"
  />
</erp-form>
