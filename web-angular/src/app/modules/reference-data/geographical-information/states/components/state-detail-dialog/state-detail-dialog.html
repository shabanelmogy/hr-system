<erp-dialog-panel
  [open]="state.detailOpen()"
  [title]="'states.view' | uiText: 'reference-states'"
  [description]="'states.viewSubtitle' | uiText: 'reference-states'"
  [closeLabel]="'actions.close' | uiText"
  icon="location"
  [manualInitialFocus]="true"
  [showFooter]="false"
  (closeRequested)="state.close()"
>
  @switch (state.detail().kind) {
    @case ('loading') {
      <erp-feedback-state kind="loading" [title]="'common.loading' | uiText" />
    }
    @case ('error') {
      <erp-feedback-state
        kind="error"
        [title]="'states.detailLoadError' | uiText: 'reference-states'"
        [actionLabel]="'actions.retry' | uiText"
        (action)="state.retryDetail()"
      />
    }
    @case ('forbidden') {
      <erp-feedback-state kind="forbidden" [title]="'authorization.forbidden.title' | uiText" />
    }
    @case ('ready') {
      @if (detail(); as detail) {
        <erp-state-read-details [state]="detail" (closed)="state.close()" />
      }
    }
  }
</erp-dialog-panel>
