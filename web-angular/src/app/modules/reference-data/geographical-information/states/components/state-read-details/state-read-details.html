<erp-form
  [form]="form"
  [title]="'states.view' | uiText: 'reference-states'"
  [submitLabel]="'actions.view' | uiText"
  appearance="dialog"
  [hideHeader]="true"
  [readOnly]="true"
  [showSubmit]="false"
>
  <div class="metadata">
    <erp-status-badge
      appearance="outline"
      [label]="('general.id' | uiText) + ': ' + state().id"
    /><erp-status-badge
      [label]="
        (state().isDeleted ? 'states.status.archived' : 'states.status.active')
          | uiText: 'reference-states'
      "
      [accent]="state().isDeleted ? 'var(--destructive)' : 'var(--success)'"
    />
  </div>
  <erp-text-field [formField]="form.nameAr" [label]="'general.nameAr' | uiText" /><erp-text-field
    [formField]="form.nameEn"
    [label]="'general.nameEn' | uiText"
  /><erp-text-field
    [formField]="form.code"
    [label]="'states.code' | uiText: 'reference-states'"
    textDirection="ltr"
  /><erp-text-field
    [formField]="form.country"
    [label]="'states.country' | uiText: 'reference-states'"
  />
  <erp-button
    formActions
    [label]="'actions.close' | uiText"
    variant="outlined"
    (activated)="closed.emit()"
  />
</erp-form>
