<header class="auth-topbar">
  <a class="brand" href="/login" [attr.aria-label]="'general.mainTitle' | uiText"><erp-icon name="team" /><strong>{{ 'general.mainTitle' | uiText }}</strong></a>
  <div class="desktop-preferences">
    <erp-appearance-preferences [language]="locale.language()" [mode]="theme.mode()" (languageChange)="changeLanguage($event)" (modeChange)="theme.setMode($event)" />
  </div>
  <details class="mobile-preferences"><summary [attr.aria-label]="'common.showMore' | uiText"><erp-icon name="more" /></summary>
    <div><erp-appearance-preferences appearance="text" [language]="locale.language()" [mode]="theme.mode()" (languageChange)="changeLanguage($event)" (modeChange)="theme.setMode($event)" /></div>
  </details>
</header>
<main class="auth-shell"><div class="auth-outer"><div class="auth-inner"><article class="auth-card">
  <erp-auth-branding />
  <section class="auth-panel"><ng-content /></section>
</article></div></div></main>
