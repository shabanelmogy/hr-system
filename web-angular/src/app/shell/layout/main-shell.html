@if(auth.user();as user){
  <erp-application-frame #frame [title]="'general.mainTitle' | uiText" homePath="/home" [name]="name()" [subtitle]="role()" [rtl]="locale.direction()==='rtl'"
    [navigationLabel]="'general.mainTitle' | uiText" [entries]="navigation()" [expandedEntries]="expandedEntries()" [searchLabel]="'general.search' | uiText" [navigationVisible]="path()!=='/apps'" [fillContent]="global() && (path()==='/home'||path()==='/super-admin'||path()==='/dev/countries')"
    [openLabel]="'menu.openSidebar' | uiText" [closeLabel]="'menu.closeSidebar' | uiText" (activated)="activate($event)">
    <div workspaceContext class="context-region">
      @if(!global()){
        <div class="context-group" role="group" [attr.aria-label]="'auth.currentContext' | uiText">
          <ng-container *ngComponentOutlet="applicationComponent" />
          @if(user.tenantName){<erp-context-badge [label]="'auth.currentTenant' | uiText" [value]="user.tenantName" icon="building" class="tenant-context" />}
          @if(company()){
            @if(companyOptions().length>1){<erp-option-select appearance="context" commitMode="external" [label]="'auth.currentCompany' | uiText" [value]="''+user.companyId" [options]="companyOptions()" [disabled]="auth.pending()" [busy]="auth.contextChanging()" (valueChange)="switchCompany($event)" />}
            @else{<erp-context-badge [label]="'auth.currentCompany' | uiText" [value]="company()" icon="company" />}
          }
          <ng-container *ngComponentOutlet="contextComponent" />
        </div>
      }
      <erp-identity-avatar [name]="name()" />
    </div>
    <div workspaceActions class="toolbar-actions" [attr.inert]="auth.contextChanging()?'':null">
      <div class="desktop-preferences">
        <erp-option-select [label]="'general.lang' | uiText" [value]="locale.language()" [options]="languages" (valueChange)="language($event)" />
        <erp-button appearance="icon" variant="text" [label]="(theme.mode()==='light'?'general.darkMode':'general.lightMode') | uiText"
          (activated)="theme.setMode(theme.mode()==='light'?'dark':'light')"><erp-icon buttonIcon [name]="theme.mode()==='light'?'sun':'moon'" /></erp-button>
      </div>
      <erp-popover-panel #settings [label]="'menu.settings' | uiText"><erp-icon popoverTrigger name="settings" />
        <section class="settings-content">
          <div class="settings-identity"><erp-identity-avatar [name]="name()" /><div><small>{{ 'dashboard.welcome' | uiText }}</small><strong>{{ name() }}</strong><span>{{ role() }}</span></div></div>
          <erp-palette-picker [label]="'menu.colorPalette' | uiText" [labels]="paletteLabels()" [value]="theme.palette()" [mode]="theme.mode()" (valueChange)="theme.setPalette($event)" />
          <div class="settings-preferences">
            <erp-option-select [label]="'general.lang' | uiText" [value]="locale.language()" [options]="languages" (valueChange)="language($event)" />
            <erp-button appearance="quiet" variant="text" [label]="(theme.mode()==='light'?'general.darkMode':'general.lightMode') | uiText"
              (activated)="theme.setMode(theme.mode()==='light'?'dark':'light')"><erp-icon buttonIcon [name]="theme.mode()==='light'?'sun':'moon'" /></erp-button>
          </div>
          <div class="settings-logout"><erp-button appearance="quiet" variant="text" severity="danger" [label]="'auth.logout' | uiText" [description]="'menu.logoutDescription' | uiText"
            fullWidth [busy]="auth.pending()" (activated)="logout()"><erp-icon buttonIcon name="logout" /></erp-button></div>
        </section>
      </erp-popover-panel>
    </div>
    @if(auth.contextChanging()){<erp-feedback-state kind="loading" [title]="'angularAuth.updatingContext' | uiText:'platform-auth'" />}
    @if(auth.contextError();as error){<erp-feedback-state kind="error" layout="inline" [title]="error | uiText:'platform-auth'" [actionLabel]="'actions.close' | uiText" (action)="auth.contextError.set(null)" />}
    @if(extraFeedback();as feedback){<erp-feedback-state kind="error" layout="inline" [title]="feedback.title" [actionLabel]="feedback.dismiss?('actions.close' | uiText):''" (action)="feedback.dismiss?.()" />}
    <div class="scope-view" [hidden]="auth.contextChanging()" [attr.inert]="auth.contextChanging()?'':null"><router-outlet /></div>
  </erp-application-frame>
}
