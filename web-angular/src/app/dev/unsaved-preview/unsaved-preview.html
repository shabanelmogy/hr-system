<main>
  <erp-page-header [title]="'messages.unsavedChangesTitle' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      [label]="(locale.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="locale.setLanguage(locale.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button
      [label]="(theme.mode() === 'light' ? 'general.darkMode' : 'general.lightMode') | uiText"
      (activated)="theme.setMode(theme.mode() === 'light' ? 'dark' : 'light')"
    />
    <erp-button
      [label]="'common.loading' | uiText"
      data-testid="busy"
      [pressed]="busy()"
      (activated)="busy.set(!busy())"
    />
    <erp-button
      [label]="'actions.editInformation' | uiText"
      data-testid="arm-change"
      (activated)="arm()"
    />
    <a
      [routerLink]="['/dev/unsaved', record()]"
      [queryParams]="{ q: 'next' }"
      fragment="section"
      data-testid="query"
      >{{ 'general.search' | uiText }}</a
    >
    <a [routerLink]="['/dev/unsaved', record() === '1' ? '2' : '1']" data-testid="record">{{
      'actions.edit' | uiText
    }}</a>
    <a [routerLink]="['/dev/unsaved', record(), { mode: 'edit' }]" data-testid="matrix">{{
      'actions.view' | uiText
    }}</a>
    <a routerLink="/dev/unsaved-destination" data-testid="leave">{{ 'actions.close' | uiText }}</a>
    <a routerLink="/dev/unsaved-denied" data-testid="denied">{{
      'authorization.forbidden.title' | uiText
    }}</a>
  </div>
  <erp-form
    [form]="form"
    [title]="'general.profile' | uiText"
    [submitLabel]="'common.save' | uiText"
    [pending]="busy()"
    (validSubmit)="save()"
  >
    <erp-text-field
      [formControl]="form.controls.name"
      [label]="'general.nameEn' | uiText"
      [readOnly]="busy()"
      [messages]="messages()"
      required
      data-testid="name"
    />
  </erp-form>
  <output
    data-testid="unsaved-state"
    [attr.data-record]="record()"
    [attr.data-revision]="revision()"
    [attr.data-busy]="busy()"
    [attr.data-alive]="lifetime.alive()"
    [attr.data-stopped]="lifetime.stopped()"
    [attr.data-path]="router.url"
  ></output>
</main>
