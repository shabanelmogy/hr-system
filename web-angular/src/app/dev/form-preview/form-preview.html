<main>
  @if (ready()) {
    <div class="preferences">
      @for (palette of palettes; track palette) {
        <erp-button
          [label]="'menu.palettes.' + palette | uiText"
          severity="secondary"
          [pressed]="theme.palette() === palette"
          (activated)="theme.setPalette(palette)"
        />
      }
      <erp-button
        [label]="(theme.mode() === 'light' ? 'general.darkMode' : 'general.lightMode') | uiText"
        (activated)="theme.setMode(theme.mode() === 'light' ? 'dark' : 'light')"
      />
      <erp-button
        [label]="(runtime.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
        data-testid="language"
        (activated)="runtime.setLanguage(runtime.language() === 'en' ? 'ar' : 'en')"
      />
    </div>
    <div class="compositions">
      <erp-form
        [form]="access"
        [title]="'auth.signIn' | uiText: 'platform-auth'"
        [submitLabel]="'common.save' | uiText"
        [pending]="pending()"
        (validSubmit)="saved.set(saved() + 1); pending.set(true)"
        data-testid="access"
      >
        <erp-text-field
          [formControl]="access.controls.email"
          [label]="'auth.email' | uiText: 'platform-auth'"
          [messages]="messages()"
          [help]="'validation.invalidEmail' | uiText"
          type="email"
          autocomplete="username"
          required
          data-testid="email"
        />
        <erp-text-field
          [formControl]="access.controls.password"
          [label]="'auth.password' | uiText: 'platform-auth'"
          [messages]="messages()"
          type="password"
          autocomplete="new-password"
          required
          data-testid="password"
        />
        <erp-button
          formActions
          [label]="'general.reset' | uiText"
          severity="secondary"
          data-testid="reset"
          (activated)="access.reset(); pending.set(false)"
        />
      </erp-form>
      <erp-form
        [form]="profile"
        [title]="'general.profile' | uiText"
        [submitLabel]="'common.saveChanges' | uiText"
        (validSubmit)="saved.set(saved() + 1)"
        data-testid="profile"
      >
        <div>
          <erp-text-field
            [formControl]="profile.controls.profile.controls.name"
            [label]="'general.nameEn' | uiText"
            [messages]="messages()"
            required
            data-testid="name"
          />
        </div>
        <erp-button
          formActions
          [label]="'common.validationErrors' | uiText"
          severity="secondary"
          data-testid="server-error"
          (activated)="serverError()"
        />
        <erp-button
          formActions
          [label]="'actions.editInformation' | uiText"
          severity="secondary"
          data-testid="async-patch"
          (activated)="patch()"
        />
      </erp-form>
    </div>
    <output data-testid="saved">{{ saved() }}</output>
  }
</main>
