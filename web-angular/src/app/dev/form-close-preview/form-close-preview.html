<main>
  <erp-page-header [title]="'messages.unsavedChangesTitle' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      [label]="(theme.mode() === 'light' ? 'general.darkMode' : 'general.lightMode') | uiText"
      (activated)="theme.setMode(theme.mode() === 'light' ? 'dark' : 'light')"
    />
    <erp-button
      [label]="(runtime.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="runtime.setLanguage(runtime.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button [label]="'actions.add' | uiText" data-testid="reopen" (activated)="reopen()" />
    <erp-button
      [label]="'common.loading' | uiText"
      data-testid="pending"
      [pressed]="pending()"
      (activated)="pending.set(!pending())"
    />
    <erp-button
      [label]="'common.error' | uiText"
      data-testid="fail"
      [pressed]="fail()"
      (activated)="fail.set(!fail())"
    />
    <erp-button
      [label]="'actions.view' | uiText"
      data-testid="nested"
      [pressed]="nested()"
      (activated)="nested.set(!nested())"
    />
    <erp-button
      [label]="'actions.editInformation' | uiText"
      data-testid="arm-revision"
      (activated)="later('revision')"
    />
    <erp-button
      [label]="'general.reset' | uiText"
      data-testid="arm-owner"
      (activated)="later('owner')"
    />
    <erp-button
      [label]="'actions.retry' | uiText"
      data-testid="arm-pending"
      (activated)="later('pending')"
    />
    <erp-button
      [label]="'actions.view' | uiText"
      data-testid="long"
      [pressed]="long()"
      (activated)="long.set(!long())"
    />
  </div>
  @if (active()) {
    @if (nested()) {
      <erp-dialog-panel
        [open]="true"
        [title]="'general.profile' | uiText"
        [closeLabel]="'common.close' | uiText"
        [pending]="pending() || (entryForm()?.checking() ?? false)"
        (closeRequested)="guard.requestClose()"
      >
        <ng-container [ngTemplateOutlet]="editor" />
      </erp-dialog-panel>
    } @else {
      <ng-container [ngTemplateOutlet]="editor" />
    }
  }
  <ng-template #editor>
    <erp-form
      [form]="form"
      [title]="'general.profile' | uiText"
      [hideHeader]="nested()"
      [submitLabel]="'common.save' | uiText"
      [pending]="pending()"
      [feedback]="feedback()"
      (validSubmit)="save()"
      data-testid="editor"
    >
      <erp-text-field
        [formControl]="form.controls.name"
        [label]="'general.nameEn' | uiText"
        required
        [readOnly]="pending()"
        [messages]="messages()"
        data-testid="name"
      />
      <erp-reference-field
        [formControl]="form.controls.reference"
        [label]="'reference.currentSelection' | uiText"
        required
        [source]="options"
        [searchable]="false"
        [readOnly]="pending()"
        [messages]="messages()"
        data-testid="reference"
      />
      @if (long()) {
        <div class="long-copy">
          @for (item of longItems; track item) {
            <p>{{ 'messages.unsavedChangesConfirm' | uiText }}</p>
          }
        </div>
      }
      <erp-button
        formActions
        [label]="'actions.cancel' | uiText"
        data-testid="close"
        [disabled]="pending() || (entryForm()?.checking() ?? false)"
        (activated)="guard.requestClose()"
      />
    </erp-form>
  </ng-template>
  <erp-form-close-guard
    #guard
    [identity]="identity()"
    [revision]="revision()"
    [active]="active()"
    [unsaved]="unsaved()"
    [pending]="pending() || (entryForm()?.checking() ?? false)"
    (closed)="close($event)"
  />
  <output
    data-testid="state"
    [attr.data-active]="active()"
    [attr.data-dirty]="unsaved()"
    [attr.data-revision]="revision()"
    [attr.data-owner]="identity()"
    [attr.data-pending]="pending()"
    [attr.data-closed]="closed()"
    [attr.data-saved]="saved()"
    [attr.data-attempts]="attempts()"
  ></output>
</main>
