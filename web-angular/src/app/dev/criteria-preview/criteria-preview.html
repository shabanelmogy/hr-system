<main>
  <erp-page-header [title]="'pagination.dataTable' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      data-testid="language"
      [label]="(runtime.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="runtime.setLanguage(runtime.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button
      data-testid="grid"
      [label]="'views.grid' | uiText"
      (activated)="view.set('grid')"
    /><erp-button
      data-testid="cards"
      [label]="'views.cards' | uiText"
      (activated)="view.set('cards')"
    />
    <erp-button
      data-testid="scope"
      [label]="'general.company' | uiText"
      (activated)="scope.set(scope() === 'a' ? 'b' : 'a')"
    />
    <erp-button
      data-testid="permission"
      [label]="'authorization.forbidden.title' | uiText"
      (activated)="allowed.set(!allowed())"
    />
    <erp-button
      data-testid="deny"
      [label]="'common.cancel' | uiText"
      (activated)="gate.allowed = !gate.allowed"
    />
    <erp-button
      data-testid="wait"
      [label]="'common.loading' | uiText"
      (activated)="gate.waitMs = gate.waitMs ? 0 : 900"
    />
  </div>
  @if (!editorOpen()) {
    @if (!criteria.resolution().valid) {
      <erp-feedback-state [title]="'common.error' | uiText" kind="error" />
    }
    <div class="collection" data-testid="collection">
      @if (view() === 'grid') {
        <erp-data-table
          [source]="source()"
          [label]="'pagination.dataTable' | uiText"
          [columns]="columns()"
          [rowId]="id"
          [rowLabel]="name"
          [sort]="criteria.applied().sort ?? undefined"
          [search]="search()"
          (searchChange)="draft($event)"
          (sortChange)="sort($event)"
          (pageChange)="page($event)"
          (retry)="refresh()"
          (rowActivated)="open($event.id)"
        >
          <ng-container toolbarContent><ng-container [ngTemplateOutlet]="actions" /></ng-container>
          <ng-container toolbarFilters><ng-container [ngTemplateOutlet]="filters" /></ng-container>
        </erp-data-table>
      } @else {
        <erp-card-list
          [source]="source()"
          [label]="'pagination.dataTable' | uiText"
          [rowId]="id"
          [rowLabel]="name"
          [search]="search()"
          (searchChange)="draft($event)"
          (pageChange)="page($event)"
          (retry)="refresh()"
          (rowActivated)="open($event.id)"
        >
          <ng-container toolbarContent><ng-container [ngTemplateOutlet]="actions" /></ng-container>
          <ng-container toolbarFilters><ng-container [ngTemplateOutlet]="filters" /></ng-container>
          <ng-template [erpCollectionCard]="source()" let-row
            ><erp-status-badge
              [label]="
                (row.active === null
                  ? 'pagination.unknownTotal'
                  : row.active
                    ? 'common.active'
                    : 'common.inactive'
                ) | uiText
              "
              [accent]="row.active === true ? 'var(--success)' : 'var(--muted-foreground)'"
          /></ng-template>
        </erp-card-list>
      }
    </div>
  }
  <ng-template #actions
    ><erp-button
      data-testid="apply"
      [label]="'general.search' | uiText"
      (activated)="apply()" /><erp-button
      data-testid="reset"
      [label]="'general.reset' | uiText"
      (activated)="reset()" /><erp-button
      data-testid="refresh"
      [label]="'actions.refresh' | uiText"
      (activated)="refresh()" /><erp-button
      data-testid="editor"
      [label]="'actions.view' | uiText"
      (activated)="open(0)"
  /></ng-template>
  <ng-template #filters
    ><div class="filters">
      <erp-option-select
        data-testid="active-filter"
        [label]="'common.active' | uiText"
        [value]="draftActive()"
        [options]="activeOptions()"
        (valueChange)="draftActive.set($event)"
      /><erp-option-select
        data-testid="id-filter"
        [label]="'general.id' | uiText"
        [value]="draftId()"
        [options]="idOptions()"
        (valueChange)="draftId.set($event)"
      /></div
  ></ng-template>
  <router-outlet />
  <output
    data-testid="state"
    [attr.data-applied]="serialized()"
    [attr.data-requests]="requests()"
    [attr.data-page]="criteria.applied().pageIndex"
    [attr.data-size]="criteria.applied().pageSize"
    [attr.data-result]="result()"
    [attr.data-pending]="criteria.pending()"
    [attr.data-valid]="criteria.resolution().valid"
    [attr.data-scope]="scope()"
    [attr.data-kind]="source().kind"
    [attr.data-snapshot]="snapshot()"
    >{{ serialized() }}</output
  >
</main>
