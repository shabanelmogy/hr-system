<main>
  <erp-page-header [title]="'general.value' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      data-testid="language"
      [label]="(locale.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="locale.setLanguage(locale.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button
      data-testid="readonly"
      [label]="'actions.viewOnly' | uiText"
      (activated)="readonly.set(!readonly())"
    />
    <erp-button
      data-testid="disable"
      [label]="'common.loading' | uiText"
      (activated)="toggleDisabled()"
    />
    <erp-button data-testid="reset" [label]="'general.reset' | uiText" (activated)="reset()" />
    <erp-button
      data-testid="patch"
      [label]="'actions.edit' | uiText"
      (activated)="form.controls.value.setValue('First\nثاني🙂')"
    />
    <erp-button
      data-testid="server-error"
      [label]="'common.error' | uiText"
      (activated)="serverError()"
    />
    <erp-button
      data-testid="swap"
      [label]="'actions.gridOptions' | uiText"
      (activated)="multiline.set(!multiline())"
    />
  </div>
  <erp-form
    data-testid="form"
    [form]="form"
    [title]="'general.value' | uiText"
    [submitLabel]="'actions.save' | uiText"
    (validSubmit)="save()"
  >
    <erp-text-field
      data-testid="name"
      [formControl]="form.controls.name"
      [label]="'general.nameEn' | uiText"
      required
      [messages]="messages()"
    />
    <erp-text-field
      data-testid="multiline"
      [formControl]="form.controls.value"
      [label]="'general.value' | uiText"
      [multiline]="multiline()"
      [rows]="4"
      [readOnly]="readonly()"
      [maxLength]="160"
      [showCounter]="true"
      required
      [messages]="messages()"
    />
    <erp-text-field
      data-testid="floating"
      [formControl]="form.controls.optional"
      [label]="'common.actual' | uiText"
      multiline
      appearance="floating"
      [readOnly]="readonly()"
    />
    <erp-numeric-field
      data-testid="numeric"
      [formControl]="form.controls.number"
      [label]="'numericField.title' | uiText"
      multiline
    />
    <erp-boolean-field
      data-testid="boolean"
      [formControl]="form.controls.flag"
      [label]="'booleanField.checkbox' | uiText"
    /> </erp-form
  ><output
    data-testid="state"
    [attr.data-value]="form.controls.value.value"
    [attr.data-saved]="saved()"
    [attr.data-changes]="changes()"
    [attr.data-snapshot]="snapshot()"
    >{{ snapshot() }}</output
  >
</main>
