<main>
  <erp-page-header [title]="'numericField.title' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      data-testid="language"
      [label]="(locale.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="locale.setLanguage(locale.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button
      data-testid="mode"
      [label]="(theme.mode() === 'light' ? 'general.darkMode' : 'general.lightMode') | uiText"
      (activated)="theme.setMode(theme.mode() === 'light' ? 'dark' : 'light')"
    />
    <erp-button
      data-testid="readonly"
      [label]="'actions.viewOnly' | uiText"
      [pressed]="readonly()"
      (activated)="readonly.set(!readonly())"
    />
    <erp-button
      data-testid="disable"
      [label]="'common.loading' | uiText"
      (activated)="toggleDisabled()"
    />
    <erp-button data-testid="reset" [label]="'general.reset' | uiText" (activated)="reset()" />
    <erp-button data-testid="patch" [label]="'actions.edit' | uiText" (activated)="patch()" />
    <erp-button
      data-testid="server-error"
      [label]="'common.error' | uiText"
      (activated)="serverError()"
    />
    <erp-button
      data-testid="limit"
      [label]="'actions.gridOptions' | uiText"
      [pressed]="limited()"
      (activated)="limited.set(!limited())"
    />
  </div>
  <erp-form
    data-testid="form"
    [form]="form"
    [title]="'numericField.title' | uiText"
    [submitLabel]="'actions.save' | uiText"
  >
    <erp-numeric-field
      data-testid="decimal"
      [formField]="form.decimal"
      [label]="'numericField.decimal' | uiText"
      [help]="'numericField.help' | uiText"
      [maxFractionDigits]="limited() ? 2 : null"
      [messages]="messages()"
    />
    <erp-numeric-field
      data-testid="integer"
      [formField]="form.integer"
      mode="integer"
      [label]="'numericField.integerLabel' | uiText"
      [help]="'numericField.help' | uiText"
      [messages]="messages()"
    />
  </erp-form>
  <output
    data-testid="state"
    [attr.data-decimal]="form.decimal().value()"
    [attr.data-integer]="form.integer().value()"
    [attr.data-valid]="form().valid()"
    [attr.data-saved]="saved()"
    [attr.data-snapshot]="snapshot()"
    >{{ form.decimal().value() }} · {{ form.integer().value() }}</output
  >
</main>
