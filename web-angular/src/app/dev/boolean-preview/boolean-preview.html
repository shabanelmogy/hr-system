<main>
  <erp-page-header [title]="'booleanField.title' | uiText" />
  <div class="tools">
    @for (palette of palettes; track palette) {
      <erp-button
        [label]="'menu.palettes.' + palette | uiText"
        [attr.data-palette]="palette"
        (activated)="theme.setPalette(palette)"
      />
    }
    <erp-button
      data-testid="language"
      [label]="(locale.language() === 'en' ? 'common.arabic' : 'common.english') | uiText"
      (activated)="locale.setLanguage(locale.language() === 'en' ? 'ar' : 'en')"
    />
    <erp-button
      data-testid="readonly"
      [label]="'actions.viewOnly' | uiText"
      [pressed]="readonly()"
      (activated)="readonly.set(!readonly())"
    />
    <erp-button
      data-testid="disable"
      [label]="'common.loading' | uiText"
      (activated)="toggleDisabled()"
    />
    <erp-button data-testid="reset" [label]="'general.reset' | uiText" (activated)="reset()" />
    <erp-button data-testid="patch" [label]="'actions.edit' | uiText" (activated)="patch()" />
    <erp-button
      data-testid="server-error"
      [label]="'common.error' | uiText"
      (activated)="serverError()"
    />
    <erp-button
      data-testid="swap"
      [label]="'actions.gridOptions' | uiText"
      (activated)="swapped.set(!swapped())"
    />
  </div>
  <erp-form
    data-testid="form"
    [form]="form"
    [title]="'booleanField.title' | uiText"
    [submitLabel]="'actions.save' | uiText"
    (validSubmit)="save()"
  >
    <erp-text-field
      data-testid="name"
      [formControl]="form.controls.name"
      [label]="'general.nameEn' | uiText"
      required
      [messages]="messages()"
    />
    <erp-boolean-field
      data-testid="checkbox"
      [formControl]="form.controls.checkbox"
      [kind]="swapped() ? 'switch' : 'checkbox'"
      [label]="'booleanField.checkbox' | uiText"
      [help]="'booleanField.help' | uiText"
      [readOnly]="readonly()"
      [messages]="messages()"
    />
    <erp-boolean-field
      data-testid="switch"
      [formControl]="form.controls.switch"
      [kind]="swapped() ? 'checkbox' : 'switch'"
      [label]="'booleanField.switch' | uiText"
      [help]="'booleanField.help' | uiText"
      [readOnly]="readonly()"
      [messages]="messages()"
    />
    <erp-boolean-field
      data-testid="consent"
      [formControl]="form.controls.consent"
      [label]="'booleanField.requiredLabel' | uiText"
      [help]="'booleanField.requiredHelp' | uiText"
      [readOnly]="readonly()"
      required
      [messages]="messages()"
    />
  </erp-form>
  <output
    data-testid="state"
    [attr.data-checkbox]="form.controls.checkbox.value"
    [attr.data-switch]="form.controls.switch.value"
    [attr.data-consent]="form.controls.consent.value"
    [attr.data-saved]="saved()"
    [attr.data-changes]="changes()"
    [attr.data-snapshot]="snapshot()"
    >{{ form.getRawValue() | json }}</output
  >
</main>
