name: Angular Client CI

on:
  push:
    paths: ["web-angular/**", "packages/tokens/**", "scripts/*ui*", ".github/workflows/angular-ci.yml"]
  pull_request:
    paths: ["web-angular/**", "packages/tokens/**", "scripts/*ui*", ".github/workflows/angular-ci.yml"]

permissions:
  contents: read

jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: web-angular/package-lock.json
      - name: Install shared package tooling
        run: npm --prefix ../packages/tokens install --no-audit --no-fund
      - name: Check canonical tokens
        run: npm --prefix ../packages/tokens run check
      - name: Install Angular dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Angular source and production build
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
        run: npm run check
