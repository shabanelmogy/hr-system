name: Mobile Client CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile:
    name: Verify mobile client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile-react/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile-react
        run: npm ci

      - name: Audit production dependencies
        working-directory: ./mobile-react
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify dependency compatibility guards
        working-directory: ./mobile-react
        run: npm run check:dependencies

      - name: Verify application, architecture, localization and tests
        working-directory: ./mobile-react
        run: npm run check

      - name: Verify Expo SDK package compatibility
        working-directory: ./mobile-react
        run: npm run check:expo

      - name: Verify generated native configuration
        working-directory: ./mobile-react
        run: npm run check:native-config

      - name: Smoke-test Android bundle export
        working-directory: ./mobile-react
        run: npm run check:export

      - name: Verify generated documentation is current
        shell: pwsh
        run: ./documentation/system/Generate-Documentation.ps1 -Check
